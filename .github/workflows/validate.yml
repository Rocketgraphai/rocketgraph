name: Validate Helm Chart

on:
  push:
    branches: [ main, ci-testing ]
    paths:
      - 'charts/**'
      - 'doc/openshift_test_server/**'
      - 'doc/openshift_fips_values.example.yaml'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'charts/**'
      - 'doc/openshift_test_server/**'
      - 'doc/openshift_fips_values.example.yaml'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  HELM_VERSION: v4.2.4

jobs:
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Lint chart
        run: helm lint charts/rocketgraph

  helm-template:
    name: Helm Template
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Template with defaults
        run: helm template test-release charts/rocketgraph

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test OpenShift profiles, storage and shared Mission Control
        run: |
          python -m pip install PyYAML==6.0.3
          python -m unittest discover -s charts/rocketgraph/tests -v

      - name: Template with all features enabled
        run: |
          helm template test-release charts/rocketgraph \
            --set frontend.tls.publicCert="test" \
            --set frontend.tls.privateKey="test" \
            --set frontend.tls.certChain="test" \
            --set backend.tls.xgtServerCert="test" \
            --set backend.tls.proxyClientCert="test" \
            --set backend.tls.proxyClientKey="test" \
            --set backend.tls.mtls=true \
            --set backend.odbc.enabled=true \
            --set backend.iaccess.enabled=true \
            --set backend.siteConfig.yml="test: true" \
            --set backend.siteConfig.py="pass" \
            --set mongodb.auth.enabled=true \
            --set mongodb.auth.rootPassword="pass" \
            --set xgt.ssl.enabled=true \
            --set xgt.ssl.cert="test" \
            --set xgt.ssl.key="test" \
            --set xgt.ssl.mtls=true \
            --set xgt.ssl.caCert="test" \
            --set xgt.license.data="test" \
            --set xgt.ldap.enabled=true \
            --set xgt.ldap.uri="ldap://test" \
            --set xgt.ldap.baseDn="dc=test" \
            --set openshift.enabled=true \
            --set networkPolicy.enabled=true

      - name: Template with existingSecret paths
        run: |
          helm template test-release charts/rocketgraph \
            --set frontend.tls.existingSecret="frontend-tls" \
            --set backend.tls.existingSecret="backend-tls" \
            --set mongodb.auth.enabled=true \
            --set mongodb.auth.existingSecret="mongo-auth" \
            --set xgt.ssl.enabled=true \
            --set xgt.ssl.existingSecret="xgt-ssl" \
            --set xgt.license.existingSecret="xgt-license"

  helm-snapshot:
    name: Helm Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      # Checksums depend on line endings (CRLF vs LF) so we strip them before comparing.
      - name: Snapshot — default
        run: |
          helm template test-release charts/rocketgraph > /tmp/default.yaml
          diff <(grep -v 'checksum/' charts/rocketgraph/tests/snapshots/default.yaml) <(grep -v 'checksum/' /tmp/default.yaml)

      - name: Snapshot — tls
        run: |
          helm template test-release charts/rocketgraph \
            --set frontend.tls.publicCert="test-cert" \
            --set frontend.tls.privateKey="test-key" \
            --set backend.tls.xgtServerCert="test-ca" \
            --set backend.tls.proxyClientCert="test-client-cert" \
            --set backend.tls.proxyClientKey="test-client-key" \
            --set xgt.ssl.enabled=true \
            --set xgt.ssl.cert="test-xgt-cert" \
            --set xgt.ssl.key="test-xgt-key" \
            --set backend.env.XGT_SERVER_CN="test-release-xgt" \
            > /tmp/tls.yaml
          diff <(grep -v 'checksum/' charts/rocketgraph/tests/snapshots/tls.yaml) <(grep -v 'checksum/' /tmp/tls.yaml)

      - name: Snapshot — ldap
        run: |
          helm template test-release charts/rocketgraph \
            --set xgt.ldap.enabled=true \
            --set xgt.ldap.uri="ldap://ldap.example.org" \
            --set "xgt.ldap.baseDn=dc=example\,dc=org" \
            --set "xgt.ldap.bindDn=cn=admin\,dc=example\,dc=org" \
            --set-string xgt.ldap.bindPassword="secret" \
            > /tmp/ldap.yaml
          diff <(grep -v 'checksum/' charts/rocketgraph/tests/snapshots/ldap.yaml) <(grep -v 'checksum/' /tmp/ldap.yaml)

      - name: Snapshot — openshift
        run: |
          helm template test-release charts/rocketgraph \
            --set openshift.enabled=true \
            > /tmp/openshift.yaml
          diff <(grep -v 'checksum/' charts/rocketgraph/tests/snapshots/openshift.yaml) <(grep -v 'checksum/' /tmp/openshift.yaml)

      - name: Snapshot — external-mongodb
        run: |
          helm template test-release charts/rocketgraph \
            --set mongodb.enabled=false \
            --set mongodb.externalUri="mongodb://user:pass@external-host:27017/dbname" \
            > /tmp/external-mongodb.yaml
          diff <(grep -v 'checksum/' charts/rocketgraph/tests/snapshots/external-mongodb.yaml) <(grep -v 'checksum/' /tmp/external-mongodb.yaml)

      - name: Snapshot — external-xgt
        run: |
          helm template test-release charts/rocketgraph \
            --set xgt.enabled=false \
            --set backend.env.MC_DEFAULT_XGT_HOST=xgt.example.com \
            > /tmp/external-xgt.yaml
          diff <(grep -v 'checksum/' charts/rocketgraph/tests/snapshots/external-xgt.yaml) <(grep -v 'checksum/' /tmp/external-xgt.yaml)

  kubeconform:
    name: Kubeconform
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      - name: Validate rendered manifests
        run: |
          helm template test-release charts/rocketgraph \
            | kubeconform -strict -summary -output text

  helm-smoke:
    name: Helm Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Create kind cluster
        uses: helm/kind-action@v1

      - name: Install chart
        run: helm install test-release charts/rocketgraph --wait --timeout 5m

      - name: Verify all pods are ready
        run: |
          kubectl get pods
          kubectl wait --for=condition=ready pod --all --timeout=300s

      - name: Check for excessive restarts
        run: |
          RESTARTS=$(kubectl get pods -o jsonpath='{.items[*].status.containerStatuses[*].restartCount}')
          echo "Restart counts: $RESTARTS"
          for count in $RESTARTS; do
            if [ "$count" -gt 2 ]; then
              echo "Pod has $count restarts"
              kubectl get pods
              kubectl describe pods
              exit 1
            fi
          done

      - name: Teardown
        if: always()
        run: kind delete cluster
