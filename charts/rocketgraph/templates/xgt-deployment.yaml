{{- if .Values.xgt.enabled }}
{{- $restricted := and .Values.openshift.enabled (eq .Values.openshift.scc "restricted-v2") }}
{{- $files := .Values.xgt.files.existingClaim }}
{{- $direct := or $restricted $files }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rocketgraph.fullname.xgt" . }}
  labels:
    app: xgt
    {{- include "rocketgraph.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.xgt.replicas }}
  selector:
    matchLabels:
      app: xgt
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: xgt
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        {{- if not (or $files .Values.xgt.config.existingConfigMap) }}
        checksum/config: {{ include (print $.Template.BasePath "/xgt-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- if or .Values.backend.oidc.caCert .Values.backend.oidc.caCertExistingSecret }}
        checksum/oidc-ca-secret: {{ .Values.backend.oidc.caCert | default .Values.backend.oidc.caCertExistingSecret | sha256sum }}
        {{- end }}
        {{- with .Values.xgt.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.xgt.hostname }}
      hostname: {{ . | quote }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.openshift.enabled }}
      serviceAccountName: {{ include "rocketgraph.fullname.serviceaccount" . }}
      {{- end }}
      {{- with (include "rocketgraph.podSecurityContext" (dict "root" . "context" .Values.xgt.podSecurityContext) | fromYaml) }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.xgt.licenseManager.enabled }}
      initContainers:
        - name: wait-for-license-manager
          image: "{{ .Values.xgt.image.repository }}:{{ coalesce .Values.xgt.image.tag .Chart.AppVersion }}{{ include "rocketgraph.fipsSuffix" . }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          command:
            - bash
            - -c
            - |
              until echo > /dev/tcp/{{ include "rocketgraph.fullname.licenseManager" . }}/6200 2>/dev/null; do echo waiting for license manager; sleep 2; done
      {{- end }}
      containers:
        - name: xgt
          image: "{{ .Values.xgt.image.repository }}:{{ coalesce .Values.xgt.image.tag .Chart.AppVersion }}{{ include "rocketgraph.fipsSuffix" . }}"
          imagePullPolicy: {{ .Values.xgt.image.pullPolicy }}
          {{- with (include "rocketgraph.containerSecurityContext" (dict "root" . "context" .Values.xgt.containerSecurityContext) | fromYaml) }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.xgt.command }}
          command: {{ .Values.xgt.command | toJson }}
          {{- with .Values.xgt.args }}
          args: {{ . | toJson }}
          {{- end }}
          {{- else if $direct }}
          command: ["/opt/xgtd/bin/xgtd"]
          args:
            - -c
            - /conf/xgtd.conf
            - -Dsystem.hostname=0.0.0.0
            - -Dsystem.io_directory=/data
            - -Dsystem.io_follow_symbolic_links=true
            - {{ printf "-Dsystem.port=%v" .Values.xgt.port | quote }}
            - {{ printf "-Dsystem.health_port=%v" .Values.xgt.healthCheck.port | quote }}
            {{- with .Values.xgt.args }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- else if .Values.xgt.args }}
          args: {{ .Values.xgt.args | toJson }}
          {{- end }}
          {{- with .Values.xgt.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: xgt
              containerPort: {{ .Values.xgt.port }}
              protocol: TCP
          startupProbe:
            grpc:
              port: {{ .Values.xgt.healthCheck.port }}
            periodSeconds: {{ .Values.xgt.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.xgt.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.xgt.startupProbe.failureThreshold }}
          readinessProbe:
            grpc:
              port: {{ .Values.xgt.healthCheck.port }}
            periodSeconds: {{ .Values.xgt.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.xgt.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.xgt.readinessProbe.failureThreshold }}
          livenessProbe:
            grpc:
              port: {{ .Values.xgt.healthCheck.port }}
            periodSeconds: {{ .Values.xgt.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.xgt.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.xgt.livenessProbe.failureThreshold }}
          {{- with .Values.xgt.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if $files }}
            {{- range $dir := list "conf" "license" "data" "log" }}
            {{- $claim := "" }}
            {{- if has $dir (list "data" "log") }}
            {{- $claim = (index $.Values.xgt.persistence $dir).existingClaim }}
            {{- end }}
            {{- if $claim }}
            - name: xgt-{{ $dir }}
              mountPath: /{{ $dir }}
            {{- else }}
            - name: xgt-files
              mountPath: /{{ $dir }}
              subPath: {{ join "/" (compact (list $.Values.xgt.files.subPath $dir)) | quote }}
              {{- if has $dir (list "conf" "license") }}
              readOnly: true
              {{- end }}
            {{- end }}
            {{- end }}
            {{- else }}
            - name: xgt-config
              mountPath: /conf/xgtd.conf
              subPath: xgtd.conf
            - name: xgt-config
              mountPath: /conf/audit.xml
              subPath: audit.xml
            - name: xgt-config
              mountPath: /conf/grouplabel.csv
              subPath: grouplabel.csv
            - name: xgt-config
              mountPath: /conf/label.csv
              subPath: label.csv
            {{- if .Values.xgt.config.proxyList }}
            - name: xgt-config
              mountPath: /conf/proxy_list
              subPath: proxy_list
            {{- end }}
            - name: xgt-data
              mountPath: /data
            - name: xgt-log
              mountPath: /log
            {{- if .Values.xgt.ssl.enabled }}
            - name: xgt-tls
              mountPath: /conf/ssl
              readOnly: true
            {{- end }}
            {{- if or .Values.xgt.license.existingSecret .Values.xgt.license.data }}
            - name: xgt-license
              mountPath: /license/xgtd.lic
              subPath: xgtd.lic
              readOnly: true
            {{- end }}
            {{- if .Values.xgt.ldap.enabled }}
            - name: sssd-config
              mountPath: /etc/sssd-config
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if or .Values.backend.oidc.caCert .Values.backend.oidc.caCertExistingSecret }}
            - name: oidc-ca-cert
              mountPath: /etc/ssl/certs/oidc-ca.pem
              subPath: oidc-ca.pem
              readOnly: true
            {{- end }}
            {{- with .Values.xgt.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- with .Values.xgt.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.xgt.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.xgt.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Always
      volumes:
        {{- if $files }}
        - name: xgt-files
          persistentVolumeClaim:
            claimName: {{ $files | quote }}
        {{- range $dir := list "data" "log" }}
        {{- with (index $.Values.xgt.persistence $dir).existingClaim }}
        - name: xgt-{{ $dir }}
          persistentVolumeClaim:
            claimName: {{ . | quote }}
        {{- end }}
        {{- end }}
        {{- else }}
        - name: xgt-config
          configMap:
            name: {{ .Values.xgt.config.existingConfigMap | default (printf "%s-config" (include "rocketgraph.fullname.xgt" .)) }}
        - name: xgt-data
          persistentVolumeClaim:
            claimName: {{ .Values.xgt.persistence.data.existingClaim | default (printf "%s-xgt-data" .Release.Name) }}
        - name: xgt-log
          persistentVolumeClaim:
            claimName: {{ .Values.xgt.persistence.log.existingClaim | default (printf "%s-xgt-log" .Release.Name) }}
        {{- if .Values.xgt.ssl.enabled }}
        - name: xgt-tls
          secret:
            secretName: {{ include "rocketgraph.xgtTlsSecret" . }}
            items:
              - key: server.cert.pem
                path: certs/server.cert.pem
              - key: server.key.pem
                path: private/server.key.pem
                mode: {{ ternary "0440" "0400" $restricted }}
              {{- if and .Values.xgt.ssl.mtls (or .Values.xgt.ssl.caCert .Values.xgt.ssl.existingSecret) }}
              - key: ca-chain.cert.pem
                path: certs/ca-chain.cert.pem
              {{- end }}
        {{- end }}
        {{- if or .Values.xgt.license.existingSecret .Values.xgt.license.data }}
        - name: xgt-license
          secret:
            secretName: {{ include "rocketgraph.xgtLicenseSecret" . }}
        {{- end }}
        {{- if .Values.xgt.ldap.enabled }}
        - name: sssd-config
          secret:
            secretName: {{ include "rocketgraph.xgtLdapSecret" . }}
            items:
              - key: sssd.conf
                path: sssd.conf
                mode: 0600
        {{- end }}
        {{- end }}
        {{- if or .Values.backend.oidc.caCert .Values.backend.oidc.caCertExistingSecret }}
        - name: oidc-ca-cert
          secret:
            secretName: {{ include "rocketgraph.backendOidcCaSecret" . }}
        {{- end }}
        {{- with .Values.xgt.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
