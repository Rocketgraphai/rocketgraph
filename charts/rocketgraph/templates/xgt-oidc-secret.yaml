{{- $ca := include "rocketgraph.xgtOidcCa" . | fromYaml -}}
{{- if and .Values.xgt.enabled $ca.enabled (eq $ca.owner "xgt") (not $ca.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $ca.name | quote }}
  labels:
    app: xgt
    {{- include "rocketgraph.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $ca.key | quote }}: {{ $ca.data | quote }}
{{- end }}
