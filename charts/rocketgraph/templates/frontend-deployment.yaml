{{- if .Values.missionControl.enabled }}
{{- $restricted := and .Values.openshift.enabled (eq .Values.openshift.scc "restricted-v2") }}
{{- $tls := or .Values.frontend.tls.existingSecret .Values.frontend.tls.publicCert .Values.frontend.tls.privateKey }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rocketgraph.fullname.frontend" . }}
  labels:
    app: frontend
    {{- include "rocketgraph.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: frontend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- with .Values.frontend.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.openshift.enabled }}
      serviceAccountName: {{ include "rocketgraph.fullname.serviceaccount" . }}
      {{- end }}
      {{- with (include "rocketgraph.podSecurityContext" (dict "root" . "context" .Values.frontend.podSecurityContext) | fromYaml) }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ coalesce .Values.frontend.image.tag .Chart.AppVersion }}{{ include "rocketgraph.fipsSuffix" . }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          {{- with (include "rocketgraph.containerSecurityContext" (dict "root" . "context" .Values.frontend.containerSecurityContext) | fromYaml) }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if $restricted }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              /usr/local/bin/docker-entrypoint-ssl.sh
              # Newer images share proxy headers in a read-only image file.
              # Keep the adjusted copy in the writable config volume; .inc
              # prevents nginx's conf.d/*.conf glob from loading it globally.
              set -- /etc/nginx/conf.d/nginx.conf
              if [ -f /etc/nginx/api_proxy_headers.inc ]; then
                cp /etc/nginx/api_proxy_headers.inc /etc/nginx/conf.d/api_proxy_headers.inc
                sed -i 's|/etc/nginx/api_proxy_headers.inc|/etc/nginx/conf.d/api_proxy_headers.inc|g' /etc/nginx/conf.d/nginx.conf
                set -- "$@" /etc/nginx/conf.d/api_proxy_headers.inc
              fi
              sed -i -E \
                -e 's/(listen[[:space:]]+(\[::\]:)?)80([[:space:];])/\18080\3/g' \
                -e 's/(listen[[:space:]]+(\[::\]:)?)443([[:space:];])/\18443\3/g' \
                -e 's/proxy_set_header X-Forwarded-Port \$server_port;/proxy_set_header X-Forwarded-Port {{ ternary .Values.frontend.service.httpsPort .Values.frontend.service.httpPort (not (empty $tls)) }};/' \
                "$@"
              exec nginx -g 'daemon off;'
          {{- end }}
          env:
            - name: BACKEND_HOST
              value: {{ include "rocketgraph.fullname.backend" . | quote }}
            - name: BACKEND_PORT
              value: "5000"
            {{- if $restricted }}
            - name: MC_SSL_PORT
              value: {{ .Values.backend.env.MC_SSL_PORT | default (.Values.frontend.service.httpsPort | toString) | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ include "rocketgraph.frontendHttpPort" . }}
              protocol: TCP
            - name: https
              containerPort: {{ include "rocketgraph.frontendHttpsPort" . }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: {{ .Values.frontend.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.frontend.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.frontend.readinessProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.frontend.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.frontend.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.frontend.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.frontend.livenessProbe.failureThreshold }}
          {{- with .Values.frontend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or $restricted $tls }}
          volumeMounts:
            {{- if $restricted }}
            {{- range $mount := list (dict "name" "nginx-config" "path" "/etc/nginx/conf.d") (dict "name" "nginx-run" "path" "/run") (dict "name" "nginx-log" "path" "/var/log/nginx") (dict "name" "nginx-temp" "path" "/var/lib/nginx/tmp") }}
            - name: {{ $mount.name }}
              mountPath: {{ $mount.path }}
            {{- end }}
            {{- end }}
            {{- if $tls }}
            - name: tls-certs
              mountPath: /etc/ssl/certs/td.pem
              subPath: public.pem
              readOnly: true
            - name: tls-certs
              mountPath: /etc/ssl/private/td.pem
              subPath: private.pem
              readOnly: true
            {{- if and .Values.frontend.tls.mtls (or .Values.frontend.tls.certChain .Values.frontend.tls.existingSecret) }}
            - name: tls-certs
              mountPath: /etc/ssl/certs/ca-chain.pem
              subPath: chain.pem
              readOnly: true
            {{- end }}
            {{- end }}
          {{- end }}
      {{- with .Values.frontend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Always
      {{- if or $restricted $tls }}
      volumes:
        {{- if $restricted }}
        {{- range $name := list "nginx-config" "nginx-run" "nginx-log" "nginx-temp" }}
        - name: {{ $name }}
          emptyDir: {}
        {{- end }}
        {{- end }}
        {{- if $tls }}
        - name: tls-certs
          secret:
            secretName: {{ include "rocketgraph.frontendTlsSecret" . }}
        {{- end }}
      {{- end }}

{{- end }}
