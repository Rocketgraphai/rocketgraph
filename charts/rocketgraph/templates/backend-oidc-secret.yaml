{{- $oidcKeys := include "rocketgraph.backendOidcKeys" . | fromYaml -}}
{{- if and .Values.missionControl.enabled (not .Values.backend.oidc.existingSecret) .Values.backend.oidc.clientSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rocketgraph.backendOidcSecret" . }}
  labels:
    app: backend
    {{- include "rocketgraph.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $oidcKeys.clientSecret | quote }}: {{ .Values.backend.oidc.clientSecret | quote }}
{{- end }}
{{- if and (or .Values.missionControl.enabled .Values.xgt.enabled) (not .Values.backend.oidc.caCertExistingSecret) .Values.backend.oidc.caCert }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rocketgraph.backendOidcCaSecret" . }}
  labels:
    app: backend
    {{- include "rocketgraph.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $oidcKeys.caCert | quote }}: {{ .Values.backend.oidc.caCert | quote }}
{{- end }}
