{{- if .Values.missionControl.enabled }}
{{- $tlsKeys := include "rocketgraph.backendTlsKeys" . | fromYaml }}
{{- if and (not .Values.backend.tls.existingSecret) (or .Values.backend.tls.xgtServerCert .Values.backend.tls.proxyClientCert .Values.backend.tls.proxyClientKey) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rocketgraph.backendTlsSecret" . }}
  labels:
    app: backend
    {{- include "rocketgraph.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.backend.tls.xgtServerCert }}
  {{ $tlsKeys.caCert | quote }}: {{ .Values.backend.tls.xgtServerCert | quote }}
  {{- end }}
  {{- if .Values.backend.tls.proxyClientCert }}
  {{ $tlsKeys.cert | quote }}: {{ .Values.backend.tls.proxyClientCert | quote }}
  {{- end }}
  {{- if .Values.backend.tls.proxyClientKey }}
  {{ $tlsKeys.key | quote }}: {{ .Values.backend.tls.proxyClientKey | quote }}
  {{- end }}
{{- end }}

{{- end }}
