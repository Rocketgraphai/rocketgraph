imagePullSecrets: []

frontend:
  image:
    repository: docker.io/rocketgraph/mission-control-frontend
    tag: ""  # Defaults to Chart.appVersion
    pullPolicy: IfNotPresent
  replicas: 1
  resources: {}
  # Recommended minimums:
  #   requests:
  #     cpu: 100m
  #     memory: 128Mi
  #   limits:
  #     cpu: 500m
  #     memory: 256Mi
  podDisruptionBudget:
    enabled: false
    # minAvailable: 1    # defaults to 1 if neither field is set; use 0 if node drains must not be blocked
    # maxUnavailable: 1  # alternative to minAvailable
  podSecurityContext: {}
  containerSecurityContext:
    allowPrivilegeEscalation: false
    # runAsNonRoot: true    # enable if the frontend image runs as a non-root user
    # capabilities:
    #   drop: [ALL]
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  service:
    type: ClusterIP
    httpPort: 80
    httpsPort: 443
    annotations: {}
  readinessProbe:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  livenessProbe:
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  # TLS certificates — provide either existingSecret OR inline cert data
  tls:
    existingSecret: ""  # Must have keys: public.pem, private.pem (optional: chain.pem for mTLS)
    publicCert: ""      # Plain-text PEM content (auto base64-encoded by k8s)
    privateKey: ""
    certChain: ""       # Inline CA chain PEM for validating browser client certs
    mtls: false         # Enable browser mTLS; mounts chain.pem from existingSecret or certChain
    external: false     # TLS terminated upstream (Ingress TLS / edge route); marks session cookies Secure

backend:
  image:
    repository: docker.io/rocketgraph/mission-control-backend
    tag: ""  # Defaults to Chart.appVersion
    pullPolicy: IfNotPresent
  replicas: 1  # Must be 1 — session state is not shared across instances
  resources: {}
  # Recommended minimums:
  #   requests:
  #     cpu: 100m
  #     memory: 256Mi
  #   limits:
  #     cpu: 1000m
  #     memory: 512Mi
  podDisruptionBudget:
    enabled: false
    # minAvailable: 1    # defaults to 1 if neither field is set; use 0 if node drains must not be blocked
    # maxUnavailable: 1  # alternative to minAvailable
  podSecurityContext: {}
  containerSecurityContext:
    allowPrivilegeEscalation: false
    # runAsNonRoot: true    # enable if the backend image runs as a non-root user
    # capabilities:
    #   drop: [ALL]
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  service:
    annotations: {}
  startupProbe:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
  readinessProbe:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  livenessProbe:
    periodSeconds: 60
    timeoutSeconds: 5
    failureThreshold: 5
  env:
    MC_DEFAULT_XGT_HOST: ""
    MC_DEFAULT_XGT_PORT: ""
    MC_SESSION_TTL: ""
    XGT_SERVER_CN: ""
    XGT_AUTH_TYPES: "['BasicAuth', 'FilePKIAuth', 'PKIAuth']"
    MC_ODBC_LIBRARY_PATH: ""
    MC_PORT: ""      # Frontend HTTP port (defaults to frontend.service.httpPort)
    MC_SSL_PORT: ""  # Frontend HTTPS port (defaults to frontend.service.httpsPort)
  # TLS certificates
  tls:
    existingSecret: ""  # Must have key: xgt-server.pem (optional: proxy-client-cert.pem, proxy-client-key.pem)
    xgtServerCert: ""
    proxyClientCert: ""
    proxyClientKey: ""
    mtls: false        # Enable mTLS for backend connections to xGT
  # Site configuration files (inline content)
  siteConfig:
    yml: ""
    py: ""
  # OIDC authentication
  oidc:
    issuer: ""            # e.g. https://idp.example.com/realms/xgt
    clientId: ""
    clientSecret: ""      # inline (creates a Secret); use existingSecret in production
    existingSecret: ""    # existing Secret with key: MC_OIDC_CLIENT_SECRET
    scopes: ""            # e.g. "openid profile email"
    frontendUrl: ""       # e.g. https://mc.example.com
    redirectUri: ""       # e.g. https://mc.example.com/api/login/oidc/callback
    allowedOrigins: ""
    tlsVerify: ""         # "true" or "false"; leave empty to use default
    caCert: ""            # inline CA PEM for OIDC provider TLS (creates a Secret)
    caCertExistingSecret: ""  # existing Secret with key: oidc-ca.pem
    # Allowlist of xGT host:port pairs the backend may connect to (SSRF prevention).
    # Defaults to the internal xGT service when xgt.enabled=true.
    # Set explicitly when using an external xGT (e.g. "xgt.myns.svc.cluster.local:4367").
    xgtAllowedHosts: ""
  # ODBC driver directory (PVC for binary .so files)
  odbc:
    enabled: false
    existingClaim: ""
    storageSize: 1Gi
    storageClassName: ""
  # IBM iAccess directory
  iaccess:
    enabled: false
    existingClaim: ""
    storageSize: 1Gi
    storageClassName: ""

mongodb:
  # Set to false to skip deploying MongoDB and use an external database instead
  enabled: true
  # The application keeps its data in its own database ("MissionControl") on
  # the server; a path component in the URI sets the authentication database,
  # not the application database.
  externalUri: ""           # e.g. mongodb://user:pass@external-host:27017/?authSource=admin
  externalUriSecret: ""     # Secret name with key 'mongodb-uri' (preferred over externalUri)
  image:
    repository: docker.io/library/mongo
    tag: 8.0.23
    pullPolicy: IfNotPresent
  replicas: 1  # Must be 1 — this chart deploys standalone MongoDB with no replica set; multiple replicas would be independent unconnected instances
  resources: {}
  # Recommended minimums:
  #   requests:
  #     cpu: 250m
  #     memory: 512Mi
  #   limits:
  #     cpu: 1000m
  #     memory: 1Gi
  podDisruptionBudget:
    enabled: false
    # minAvailable: 1    # defaults to 1 if neither field is set; use 0 if node drains must not be blocked
    # maxUnavailable: 1  # alternative to minAvailable
  podSecurityContext: {}
  containerSecurityContext:
    allowPrivilegeEscalation: false
    # runAsNonRoot: true    # enable if the MongoDB image runs as a non-root user (Percona uid 1001 qualifies; stock mongo uid 999 also qualifies)
    # capabilities:
    #   drop: [ALL]
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  service:
    annotations: {}
  readinessProbe:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  livenessProbe:
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  auth:
    enabled: false
    existingSecret: ""  # Must have key: mongodb-root-password (user is always "rocketgraph")
    rootPassword: ""
  # TLS for connections to MongoDB
  tls:
    enabled: false
    existingSecret: ""  # Keys: server.pem (cert+key concatenated), ca.pem (required); optional: client.pem for mTLS
    cert: ""            # Inline server cert PEM
    key: ""             # Inline server key PEM
    caCert: ""          # Inline CA cert PEM — required by mongod (5.0+) and used by the backend to verify the server
    mode: requireTLS    # requireTLS | preferTLS | allowTLS
    clientCert: ""      # Inline client cert PEM — used by the backend when mtls is true
    clientKey: ""       # Inline client key PEM — used by the backend when mtls is true
    mtls: false         # Require the backend to present a client cert; needs client.pem in existingSecret or inline clientCert/clientKey
  # --tlsFIPSMode is added automatically when fips.enabled=true and TLS is on.
  # Encryption at rest — requires MongoDB Enterprise or Percona Server for MongoDB
  encryption:
    enabled: false
    existingSecret: ""  # Secret with key: encryption.key (32-byte base64-encoded key)
    key: ""             # Inline encryption key
  persistence:
    size: 1Gi
    storageClassName: ""
    existingClaim: ""

xgt:
  enabled: true  # Set to false to use an external xGT server
  image:
    repository: docker.io/rocketgraph/xgt
    tag: ""  # Defaults to Chart.appVersion
    pullPolicy: IfNotPresent
  replicas: 1  # Must be 1 — xgt does not support multi-instance deployments in this configuration
  resources: {}
  # Recommended minimums:
  #   requests:
  #     cpu: 500m
  #     memory: 2Gi
  #   limits:
  #     cpu: 4000m
  #     memory: 8Gi
  podDisruptionBudget:
    enabled: false
    # minAvailable: 1    # defaults to 1 if neither field is set; use 0 if node drains must not be blocked
    # maxUnavailable: 1  # alternative to minAvailable
  podSecurityContext: {}
  containerSecurityContext:
    allowPrivilegeEscalation: false
    # runAsNonRoot: true    # enable if the xgt image runs as a non-root user
    # capabilities:
    #   drop: [ALL]
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  port: 4367
  service:
    type: ClusterIP
    annotations: {}
  startupProbe:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
  readinessProbe:
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  livenessProbe:
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  persistence:
    data:
      size: 10Gi
      storageClassName: ""
      existingClaim: ""
    log:
      size: 1Gi
      storageClassName: ""
      existingClaim: ""
  ssl:
    enabled: false
    existingSecret: ""  # Must have keys: server.cert.pem, server.key.pem
    cert: ""            # Inline server cert PEM
    key: ""             # Inline server key PEM
    mtls: false         # Require client certs; needs ca-chain.cert.pem in existingSecret or via caCert
    caCert: ""          # Inline CA cert PEM for validating client certs (ca-chain.cert.pem)
  license:
    existingSecret: ""  # Must have key: xgtd.lic
    data: ""            # Plain-text license content
  # LDAP authentication via SSSD
  ldap:
    enabled: false
    existingSecret: ""  # Must have key: sssd.conf
    uri: ""           # e.g. ldap://ldap.example.org
    baseDn: ""        # e.g. dc=example,dc=org
    bindDn: ""        # e.g. cn=admin,dc=example,dc=org
    bindPassword: ""  # bind password
    startTls: false   # enable STARTTLS for LDAP connections
    insecure: false   # disable TLS entirely (non-TLS ldap:// URIs)
    sssdConfig: ""    # raw sssd.conf content (overrides uri/baseDn/bindDn/etc.)
  # xGT config file overrides
  config:
    grouplabelCsv: ""  # Override grouplabel.csv contents
    labelCsv: ""       # Override label.csv contents
    proxyList: ""      # Newline-separated list of proxy CNs for PKIAuth (sets security.proxy_list)
  # Extra xgtd.conf overrides — any key here is merged into the config
  # Example: { "system.max_memory": "16" }
  extraConfig: {}
  # gRPC health check port (plain gRPC, no TLS)
  healthCheck:
    port: 4366
  # xGT License Manager — standalone deployment serving license files over port 6200.
  # Multiple xGT instances connect to it by service name; license.location is set automatically.
  licenseManager:
    enabled: false
    image:
      repository: docker.io/rocketgraph/xgt-license-manager
      tag: 1.5.1
      pullPolicy: IfNotPresent
    resources: {}
    podSecurityContext:
      fsGroup: 1000
    containerSecurityContext:
      runAsNonRoot: true
      allowPrivilegeEscalation: false
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    service:
      type: ClusterIP
      annotations: {}
    startupProbe:
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30
    readinessProbe:
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    livenessProbe:
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    licenseFiles:
      existingSecret: ""  # Secret whose keys are mounted as files under /conf/licenses/
      data: {}            # Map of filename to content, e.g. { "server.lic": "..." }
    persistence:
      conf:
        size: 1Gi
        storageClassName: ""
        existingClaim: ""
      log:
        size: 1Gi
        storageClassName: ""
        existingClaim: ""

ingress:
  enabled: false
  className: ""  # e.g. "nginx", "traefik", "alb" — maps to spec.ingressClassName
  annotations: {}
  # Common annotation examples:
  #
  # nginx ingress controller:
  #   kubernetes.io/ingress.class: nginx
  #   nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  #
  # cert-manager automatic TLS (pair with a tls entry below):
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  #
  # AWS ALB controller:
  #   kubernetes.io/ingress.class: alb
  #   alb.ingress.kubernetes.io/scheme: internet-facing
  #   alb.ingress.kubernetes.io/target-type: ip
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # tls:
  #   - secretName: rocketgraph-tls
  #     hosts:
  #       - chart-example.local

fips:
  # Set to true to use FIPS-compliant image variants.
  # - frontend, backend, xgt, license manager: "-fips" is appended to the
  #   image tag (e.g. "2.6.1-fips")
  # - mongodb: switches to percona/percona-server-mongodb
  # When TLS is also enabled, mongod gets --tlsFIPSMode automatically.
  enabled: false
  mongoImage:
    repository: docker.io/percona/percona-server-mongodb
    tag: 8.0.23

openshift:
  # Set to true when deploying on OpenShift — creates a ServiceAccount bound to the SCC below.
  enabled: false
  # SCC granted to the release ServiceAccount.
  # anyuid   — required when any image has a fixed non-root UID (e.g. Percona MongoDB uid 1001).
  # nonroot  — sufficient when all images declare a non-root USER but without a fixed UID;
  #            pair with containerSecurityContext.runAsNonRoot: true on each component.
  scc: anyuid

networkPolicy:
  enabled: true
