{
  "system.max_memory": "1",
  "system.usessl": "true",
  "system.usemtls": "false",
  "system.ssl_root_dir": "/conf/ssl",
  "license.location": "/license/xgtd.lic",
  "logging.filepath": "/log",
  "logging.fileprefix": "xgtd",
  "logging.log_to_console": "true",
  "audit.config_file": "/conf/audit.xml",
  "security.adminlabel": "xgtadmin",
  "security.grouplabelfile": "/conf/grouplabel.csv",
  "security.labelfile": "/conf/label.csv",
  "security.oidc": {
    "issuer": "https://oauth-openshift.apps.example.com",
    "client_id": "xgt-demo-client",
    "validation_mode": "openshift_userapi",
    "openshift_user_api_uri": "https://kubernetes.default.svc/apis/user.openshift.io/v1/users/~",
    "username_claim": "metadata.name",
    "groups_claim": "groups",
    "scopes": "user:info",
    "ca_cert": "/conf/oidc-ca.pem"
  }
}
